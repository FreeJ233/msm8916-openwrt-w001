name: 🚀 Build_imm_高通410系列

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: ' ← 选择是否开启 SSH 调试专业人员使用'
        required: false
        default: false
        type: boolean
      profile:
        description: ' ↓ 支持多款型号 手动选择要编译的机型 ↓ '
        type: choice
        options:
          - ufi001c
          - w001
        default: w001           # 修改点：默认机型改为 w001
        required: true
      kernel:
        description: ' ↓ 选择内核版本（自动匹配上游支持的提交）↓ '
        type: choice
        options:
          - 6.12
          - 6.18
          - 6.6
        default: 6.12
        required: true
      upstream:
        description: ' ↓ 选择上游源码仓库 ↓ '
        type: choice
        options:
          - lkiuyu/immortalwrt
        default: lkiuyu/immortalwrt
        required: true
      custom_hash:
        description: ' ↓ 高级选项：手动指定 hash（留空由系统自动选择）↓ '
        required: false
        default: ''
        type: string
      extra_packages:
        description: ' ↓ 输入额外包名（逗号或空格分隔，留空则不添加）↓ '
        required: false
        default: ''
        type: string

env:
  REPO_URL: https://github.com/${{ github.event.inputs.upstream }}
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: ${{ format('config/{0}-{1}.config', github.event.inputs.profile, github.event.inputs.kernel) }}
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:

    - name: 📥 检出仓库代码
      uses: actions/checkout@main

    - name: 🖥️ 显示编译服务器硬件信息
      run: |
        chmod 755 ./scripts/show_hardware_info.sh
        ./scripts/show_hardware_info.sh

    - name: 🧹 释放编译服务器磁盘空间
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: false
        dotnet: false
        haskell: false
        large-packages: false
        docker-images: false
        swap-storage: true

    - name: 🔧 初始化编译环境（安装系统依赖）
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -y update
        sudo -E apt-get -y install $(curl -fsSL https://raw.githubusercontent.com/xuxin1955/depend_ubuntu2204_openwrt/refs/heads/main/depend_ubuntu2204_openwrt)

    - name: 🔧 安装 mkbootimg 工具（生成 boot.img 必须）
      run: |
        wget https://github.com/xuxin1955/depend_ubuntu2204_openwrt/releases/download/ubuntu_26.04_LTS_mkbootimg/mkbootimg_34.0.5-12build1_all.deb
        sudo dpkg -i mkbootimg_34.0.5-12build1_all.deb
        sudo apt-get install -f -y
        mkbootimg --help || true
        MKBOOTIMG_PATH=$(which mkbootimg)
        if [ -n "$MKBOOTIMG_PATH" ]; then
          echo "✅ mkbootimg 安装成功: $MKBOOTIMG_PATH"
        else
          echo "❌ mkbootimg 未找到，请检查安装步骤！"
        fi
        sudo timedatectl set-timezone "$TZ"
        sudo chmod 777 /mnt
        df -hT

    - name: 🐍 安装 Python 编译工具链
      run: |
        python3 -m pip cache purge
        python3 -m pip install --upgrade --force-reinstall pip
        python3 -m pip install --upgrade --force-reinstall 'setuptools>=65' wheel
        python3 -m pip install --upgrade 'setuptools-scm>=8,<10'
        python3 -m pip install --upgrade cython packaging tomli
        python3 -m pip install Unidecode pyelftools
        python3 -m pip --version
        python3 -c "import setuptools.build_meta; print('setuptools.build_meta OK')"

    - name: 🧠 智能选择支持目标内核的上游提交
      id: smart_lock
      working-directory: /mnt
      run: |
        KERNEL="${{ github.event.inputs.kernel }}"
        CUSTOM_HASH="${{ github.event.inputs.custom_hash }}"
        LOCK_FILE="${GITHUB_WORKSPACE}/upstream_lock.txt"
        TARGET_CONFIG="target/linux/msm89xx/config-${KERNEL}"
        TARGET_MAKEFILE="target/linux/msm89xx/Makefile"

        echo "=================================================="
        echo "🎯 目标内核版本: Linux ${KERNEL}"
        echo "=================================================="

        if [ -n "$CUSTOM_HASH" ]; then
          echo "🔑 优先级1：使用用户手动指定的 hash: $CUSTOM_HASH"
          echo "selected_hash=$CUSTOM_HASH" >> $GITHUB_OUTPUT
          echo "selection_reason=用户手动指定" >> $GITHUB_OUTPUT
          exit 0
        fi

        if [ -f "$LOCK_FILE" ]; then
          LOCKED_HASH=$(grep -v '^#' "$LOCK_FILE" | grep -v '^[[:space:]]*$' | head -1 | tr -d '[:space:]')
          if [ -n "$LOCKED_HASH" ]; then
            echo "🔒 优先级2：upstream_lock.txt hash: $LOCKED_HASH"
            echo "selected_hash=$LOCKED_HASH" >> $GITHUB_OUTPUT
            echo "selection_reason=upstream_lock.txt 锁定" >> $GITHUB_OUTPUT
            exit 0
          fi
        fi

        echo "🤖 优先级3：自动智能查找支持 Linux ${KERNEL} 的最新上游提交..."
        git clone --depth=200 --no-checkout --filter=blob:none ${{ env.REPO_URL }} upstream_search
        cd upstream_search

        FOUND_HASH=""
        FOUND_PATCHVER=""
        COMMIT_COUNT=0
        CHECKED_COUNT=0
        ALL_COMMITS=$(git log --format="%H" origin/master)
        TOTAL=$(echo "$ALL_COMMITS" | wc -l)
        echo "📊 共获取 $TOTAL 条历史提交，开始验证..."

        for commit_hash in $ALL_COMMITS; do
          COMMIT_COUNT=$((COMMIT_COUNT + 1))
          CHECKED_COUNT=$((CHECKED_COUNT + 1))

          CONFIG_EXISTS=$(git ls-tree -r "$commit_hash" --name-only 2>/dev/null | grep -c "^${TARGET_CONFIG}$" || true)

          if [ "$CONFIG_EXISTS" -gt "0" ]; then
            PATCHVER=$(git show "${commit_hash}:${TARGET_MAKEFILE}" 2>/dev/null | grep "^KERNEL_PATCHVER" | cut -d= -f2 | tr -d '[:space:]' || echo "")
            echo "  ✅ 候选提交 #${COMMIT_COUNT}: ${commit_hash:0:12} PATCHVER=${PATCHVER}"
            FOUND_HASH="$commit_hash"
            FOUND_PATCHVER="$PATCHVER"
            if [ "$PATCHVER" = "$KERNEL" ]; then
              echo "  🎯 精确匹配！"
              break
            else
              if [ "$CHECKED_COUNT" -gt "20" ]; then
                echo "  ⏱ 超过额外查找限制，使用当前最佳候选"
                break
              fi
            fi
          fi
        done

        cd ..

        if [ -z "$FOUND_HASH" ]; then
          echo "::error::❌ 未找到支持 Linux ${KERNEL} 的提交！请改选其他内核版本"
          exit 1
        fi

        echo "=================================================="
        echo "✅ 智能选择: ${FOUND_HASH:0:12} PATCHVER=${FOUND_PATCHVER}"
        echo "=================================================="
        echo "selected_hash=${FOUND_HASH}" >> $GITHUB_OUTPUT
        echo "selection_reason=自动智能匹配（上游 PATCHVER=${FOUND_PATCHVER}）" >> $GITHUB_OUTPUT

    - name: 📦 拉取上游 ImmortalWrt 源码（使用智能选定的提交）
      working-directory: /mnt
      run: |
        df -hT $PWD
        SELECTED_HASH="${{ steps.smart_lock.outputs.selected_hash }}"
        REASON="${{ steps.smart_lock.outputs.selection_reason }}"
        echo "📡 克隆: ${{ env.REPO_URL }} 分支: ${{ env.REPO_BRANCH }}"
        echo "   策略: ${REASON} | Hash: ${SELECTED_HASH:0:12}"
        git clone ${{ env.REPO_URL }} -b ${{ env.REPO_BRANCH }} openwrt
        if [ -n "$SELECTED_HASH" ]; then
          cd openwrt
          git checkout "$SELECTED_HASH"
          echo "✅ 已切换: $(git log --oneline -1)"
        fi
        ln -sf /mnt/openwrt $GITHUB_WORKSPACE/openwrt
        echo "✅ 源码准备完成"

    - name: 🔧 设置内核版本并三重验证
      run: |
        KERNEL="${{ github.event.inputs.kernel }}"
        MAKEFILE="openwrt/target/linux/msm89xx/Makefile"
        UPSTREAM_CONFIG="openwrt/target/linux/msm89xx/config-${KERNEL}"
        USER_CONFIG="${{ env.CONFIG_FILE }}"

        echo "=================================================="
        echo "🔧 内核版本设置与验证"
        echo "=================================================="

        echo "📋 验证1：用户编译配置文件"
        if [ ! -f "${GITHUB_WORKSPACE}/${USER_CONFIG}" ]; then
          echo "::error::❌ 用户 config 不存在: ${USER_CONFIG}"
          echo "::error::需要: config/ufi001c-6.6.config / 6.12.config / 6.18.config 或 w001 对应文件"
          exit 1
        fi
        echo "  ✅ ${USER_CONFIG} 存在"

        echo "📋 验证2：上游内核配置文件"
        ls openwrt/target/linux/msm89xx/config-* 2>/dev/null | while read f; do
          VER=$(basename "$f" | sed 's/config-//')
          if [ "$VER" = "$KERNEL" ]; then
            echo "    ✅ Linux ${VER} ← 当前选择"
          else
            echo "    ℹ️  Linux ${VER}"
          fi
        done
        if [ ! -f "$UPSTREAM_CONFIG" ]; then
          echo "::error::❌ 上游不包含 config-${KERNEL}"
          exit 1
        fi
        echo "  ✅ 上游 config-${KERNEL} 存在"

        echo "📋 修改 KERNEL_PATCHVER:"
        echo "  修改前: $(grep 'KERNEL_PATCHVER' $MAKEFILE)"
        sed -i "s/^KERNEL_PATCHVER:=.*/KERNEL_PATCHVER:=${KERNEL}/" "$MAKEFILE"
        echo "  修改后: $(grep 'KERNEL_PATCHVER' $MAKEFILE)"

        echo "📋 验证3：KERNEL_PATCHVER 写入确认"
        ACTUAL=$(grep "^KERNEL_PATCHVER" "$MAKEFILE" | cut -d= -f2 | tr -d '[:space:]')
        if [ "$ACTUAL" != "${KERNEL}" ]; then
          echo "::error::❌ KERNEL_PATCHVER 写入失败！期望: ${KERNEL} 实际: ${ACTUAL}"
          exit 1
        fi
        echo "  ✅ KERNEL_PATCHVER=${ACTUAL} 确认"

        echo "=================================================="
        # 修改点：输出当前选择的机型（动态）
        echo "  ✅ 三重验证通过！将编译 Linux ${KERNEL} for ${{ github.event.inputs.profile }}"
        echo "=================================================="

    - name: 📝 加载自定义 feeds 源并执行前置脚本
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default && echo "✅ 已替换 feeds.conf.default"
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH
        echo "✅ diy-part1.sh 执行完成"

    - name: 🔄 更新所有 feeds 软件包索引
      run: |
        cd openwrt
        ./scripts/feeds update -a
        echo "✅ feeds 更新完成"

    - name: 🗑️ 删除 smpackage 与官方 feeds 中的冲突包
      run: |
        echo "🗑️ 删除 smpackage 自身携带的系统基础包..."
        rm -rf openwrt/feeds/smpackage/base-files openwrt/feeds/smpackage/dnsmasq openwrt/feeds/smpackage/firewall* openwrt/feeds/smpackage/fullconenat openwrt/feeds/smpackage/libnftnl openwrt/feeds/smpackage/nftables openwrt/feeds/smpackage/ppp openwrt/feeds/smpackage/opkg openwrt/feeds/smpackage/ucl openwrt/feeds/smpackage/upx openwrt/feeds/smpackage/vsftpd* openwrt/feeds/smpackage/miniupnpd-iptables openwrt/feeds/smpackage/wireless-regdb

        echo "🗑️ 删除 luci feed 中与 smpackage 冲突的包..."
        rm -rf openwrt/feeds/luci/applications/luci-app-mosdns

        echo "🗑️ 删除 packages feed 中与 smpackage 冲突的包..."
        rm -rf openwrt/feeds/packages/net/alist openwrt/feeds/packages/net/adguardhome openwrt/feeds/packages/net/mosdns openwrt/feeds/packages/net/xray-core openwrt/feeds/packages/net/xray-plugin openwrt/feeds/packages/net/v2ray-core openwrt/feeds/packages/net/v2ray-geodata openwrt/feeds/packages/net/sing-box openwrt/feeds/packages/net/smartdns
        rm -rf openwrt/feeds/packages/utils/v2dat

        echo "🔄 替换 golang 为 kenzok8 维护版本..."
        rm -rf openwrt/feeds/packages/lang/golang
        git clone https://github.com/kenzok8/golang -b 1.26 openwrt/feeds/packages/lang/golang || git clone https://github.com/kenzok8/golang openwrt/feeds/packages/lang/golang
        echo "✅ 冲突包处理完成"

    - name: 📦 安装所有 feeds 软件包
      run: |
        cd openwrt
        ./scripts/feeds install -a -f
        echo "✅ feeds 安装完成"

    - name: ⚙️ 加载自定义配置文件并执行后置脚本
      run: |
        [ -e files ] && mv files openwrt/files && echo "✅ 已复制 files/ 目录到源码"
        mv "$CONFIG_FILE" openwrt/.config
        echo "✅ 已加载编译配置: $CONFIG_FILE"
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH
        echo "✅ diy-part2.sh 执行完成"

    - name: ➕ 安装用户在触发时输入的额外软件包
      if: ${{ inputs.extra_packages != '' }}
      run: |
        cd openwrt
        echo "📦 用户请求的额外包: ${{ inputs.extra_packages }}"

        RAW='${{ inputs.extra_packages }}'
        CUSTOM_IP=$(echo "$RAW" | grep -oP '(?<=__ip__)[^,\s]+' || true)
        CUSTOM_HOSTNAME=$(echo "$RAW" | grep -oP '(?<=__hostname__)[^,\s]+' || true)

        if [ -n "$CUSTOM_IP" ]; then
          echo "🌐 设置管理 IP: $CUSTOM_IP"
          sed -i "s/192\.168\.2\.1/$CUSTOM_IP/g" package/base-files/files/bin/config_generate
        fi

        if [ -n "$CUSTOM_HOSTNAME" ]; then
          echo "🏷️ 设置主机名: $CUSTOM_HOSTNAME"
          sed -i "s/set system\.@system\[0\]\.hostname='ImmortalWrt'/set system.@system[0].hostname='$CUSTOM_HOSTNAME'/" package/base-files/files/bin/config_generate || true
          sed -i "s/option hostname 'ImmortalWrt'/option hostname '$CUSTOM_HOSTNAME'/" package/base-files/files/etc/config/system 2>/dev/null || true
        fi

        PACKAGES=$(echo "$RAW" | sed 's/,/ /g' | tr ' ' '\n' | grep -v '^__ip__' | grep -v '^__hostname__' | tr '\n' ' ')

        if echo "$PACKAGES" | grep -qw "luci-app-turboacc"; then
          echo "⚡ 检测到 luci-app-turboacc，执行 turboacc 安装脚本..."
          curl -sSL https://raw.githubusercontent.com/mufeng05/turboacc/main/add_turboacc.sh -o add_turboacc.sh && bash add_turboacc.sh || echo "⚠️ turboacc 脚本执行失败，跳过"
        fi

        for pkg in $PACKAGES; do
          if [ -n "$pkg" ]; then
            CFG="CONFIG_PACKAGE_${pkg}"
            if grep -q "^# ${CFG} is not set" .config; then
              sed -i "s/^# ${CFG} is not set$/${CFG}=y/" .config
              echo "✅ 已启用（替换）: ${CFG}=y"
            elif grep -q "^${CFG}=" .config; then
              sed -i "s/^${CFG}=.*$/${CFG}=y/" .config
              echo "✅ 已启用（更新）: ${CFG}=y"
            else
              echo "${CFG}=y" >> .config
              echo "✅ 已启用（追加）: ${CFG}=y"
            fi
          fi
        done
        echo "✅ 额外包处理完成"

    - name: 🐛 SSH 远程调试（有效时间 6h，输入 exit 退出继续编译）
      uses: mxschmitt/action-tmate@master
      if: ${{ inputs.ssh || contains(github.event.action, 'ssh') }}

    - name: 🔨 生成最终编译配置（make defconfig）
      id: config
      run: |
        cd openwrt
        make defconfig
        echo "✅ defconfig 生成完成"
        echo "📋 编译包数量: $(grep -c '=y' .config || true)"

    - name: ⬇️ 下载编译所需的软件包源码
      id: package
      run: |
        cd openwrt
        echo "📡 开始下载依赖包..."
        make download -j4 V=s
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;
        echo "✅ 软件包下载完成"

    - name: 📤 上传 defconfig 编译配置（供调试参考）
      uses: actions/upload-artifact@main
      with:
        name: build-config-${{ github.event.inputs.profile }}-kernel${{ github.event.inputs.kernel }}
        path: |
          ${{ github.workspace }}/openwrt/.config
          ${{ github.workspace }}/openwrt/feeds.conf.default
          ${{ github.workspace }}/openwrt/target/linux/msm89xx/Makefile
        include-hidden-files: true

    - name: 🚀 开始编译固件（多线程，失败自动回退单线程）
      id: compile
      run: |
        cd openwrt
        echo "🔧 使用 $(nproc) 线程编译..."
        echo "📌 内核版本: ${{ github.event.inputs.kernel }}"
        make -j$(nproc) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
        echo "✅ 固件编译完成！"

    - name: 🔍 获取编译固件的实际内核版本
      if: steps.compile.outputs.status == 'success'
      run: |
        echo "🔍 多路径探测真实内核版本..."
        KERNEL_VER=""

        KVER_FILE=$(find /mnt/openwrt/build_dir/ -maxdepth 4 -name ".kernelversion" 2>/dev/null | head -1)
        if [ -n "$KVER_FILE" ] && [ -f "$KVER_FILE" ]; then
          KERNEL_VER=$(cat "$KVER_FILE" | tr -d '[:space:]')
          echo "✅ 方法1成功：$KVER_FILE → ${KERNEL_VER}"
        fi

        if [ -z "$KERNEL_VER" ]; then
          KDIR=$(find /mnt/openwrt/build_dir/ -maxdepth 4 -mindepth 3 -type d -name "linux-[0-9]*" 2>/dev/null | head -1)
          if [ -n "$KDIR" ]; then
            KERNEL_VER=$(basename "$KDIR" | sed 's/^linux-//')
            echo "✅ 方法2成功：$(basename $KDIR) → ${KERNEL_VER}"
          fi
        fi

        if [ -z "$KERNEL_VER" ]; then
          KERNEL_VER=$(find /mnt/openwrt/bin/targets/ -name "*.manifest" 2>/dev/null | head -1 | xargs grep -m1 "^kernel" 2>/dev/null | awk '{print $2}' || echo "")
          if [ -n "$KERNEL_VER" ]; then
            echo "✅ 方法3成功：manifest → ${KERNEL_VER}"
          fi
        fi

        if [ -z "$KERNEL_VER" ]; then
          KERNEL_VER="${{ github.event.inputs.kernel }}.x（探测失败）"
          echo "⚠️ 方法1-3均失败，使用兜底值"
          find /mnt/openwrt/build_dir/ -maxdepth 4 -type d 2>/dev/null | head -20 || true
        fi

        echo "KERNEL_VER=${KERNEL_VER}" >> $GITHUB_ENV
        echo "📌 实际编译内核: ${KERNEL_VER}"

        SELECTED="${{ github.event.inputs.kernel }}"
        if echo "${KERNEL_VER}" | grep -qE "^${SELECTED//./\\.}"; then
          echo "✅ 版本一致性验证通过：实际 ${KERNEL_VER} 匹配选择 ${SELECTED}"
        else
          echo "⚠️ 注意：实际 ${KERNEL_VER} / 选择 ${SELECTED}（主版本不同请排查）"
        fi

    - name: 💾 查看编译服务器剩余磁盘空间
      if: (!cancelled())
      run: df -hT

    - name: 🔧 修复 Git 大文件上传缓冲区
      run: git config --global http.postBuffer 524288000

    - name: 📦 上传完整 bin 目录（仅 UPLOAD_BIN_DIR=true 时生效）
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}_kernel${{ github.event.inputs.kernel }}
        path: openwrt/bin

    - name: 📁 整理固件输出文件（提取 boot.img + rootfs.img）
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "🔍 查找固件文件..."
        ls -la

        BOOT_IMG=$(ls *boot.img.gz *boot.img 2>/dev/null | head -1)
        SYSTEM_IMG=$(ls *system.img.gz *system.img *rootfs.img.gz *rootfs.img 2>/dev/null | head -1)

        if [ -z "$BOOT_IMG" ] || [ -z "$SYSTEM_IMG" ]; then
          echo "::error::❌ 固件文件未找到！"
          ls -la
          exit 1
        fi

        echo "✅ boot: $BOOT_IMG | rootfs: $SYSTEM_IMG"
        mkdir -p firmware_output

        if echo "$BOOT_IMG" | grep -q '\.gz$'; then
          gzip -dk "$BOOT_IMG"
          cp "${BOOT_IMG%.gz}" firmware_output/boot.img
        else
          cp "$BOOT_IMG" firmware_output/boot.img
        fi

        if echo "$SYSTEM_IMG" | grep -q '\.gz$'; then
          gzip -dk "$SYSTEM_IMG"
          cp "${SYSTEM_IMG%.gz}" firmware_output/rootfs.img
        else
          cp "$SYSTEM_IMG" firmware_output/rootfs.img
        fi

        cp *.manifest firmware_output/ 2>/dev/null || true
        cp sha256sums firmware_output/ 2>/dev/null || true

        echo "✅ 固件输出清单："
        ls -lh firmware_output/
        echo "FIRMWARE=$PWD/firmware_output" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 📤 上传固件到 Artifacts（临时下载用）
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}_kernel${{ github.event.inputs.kernel }}
        path: ${{ env.FIRMWARE }}

    - name: 📦 打包 Release 单一压缩包（固件 + 配置合并）
      id: pack_release
      if: >-
        env.UPLOAD_RELEASE == 'true' &&
        steps.organize.outputs.status == 'success' &&
        !cancelled()
      run: |
        PROFILE="${{ github.event.inputs.profile }}"
        KERNEL="${{ github.event.inputs.kernel }}"
        FILE_DATE_CLEAN=$(echo "${FILE_DATE}" | sed 's/^_//')

        RELEASE_DIR="${GITHUB_WORKSPACE}/release_upload"
        PACK_TMP="${GITHUB_WORKSPACE}/pack_tmp"
        mkdir -p "$RELEASE_DIR" "$PACK_TMP"

        # 单一压缩包名字
        RELEASE_ZIP="OpenWrt_openstick-${PROFILE}_${FILE_DATE_CLEAN}_kernel${KERNEL}.zip"

        # 1) 固件文件（boot.img / rootfs.img / manifest / sha256sums）
        echo "📁 收集固件文件到 firmware/"
        mkdir -p "${PACK_TMP}/firmware"
        cp -r "${FIRMWARE}"/* "${PACK_TMP}/firmware/" 2>/dev/null || true

        # 2) 编译配置文件（.config / feeds.conf.default / Makefile）
        echo "📁 收集编译配置到 build-config/"
        mkdir -p "${PACK_TMP}/build-config"
        cp "${GITHUB_WORKSPACE}/openwrt/.config" "${PACK_TMP}/build-config/.config" 2>/dev/null || true
        cp "${GITHUB_WORKSPACE}/openwrt/feeds.conf.default" "${PACK_TMP}/build-config/feeds.conf.default" 2>/dev/null || true
        cp "${GITHUB_WORKSPACE}/openwrt/target/linux/msm89xx/Makefile" "${PACK_TMP}/build-config/Makefile" 2>/dev/null || true

        # 3) 合并打包成一个 zip
        echo "📦 打包为单一压缩包: ${RELEASE_ZIP}"
        cd "${PACK_TMP}"
        zip -r "${RELEASE_DIR}/${RELEASE_ZIP}" ./*
        cd -

        echo "✅ Release 单一压缩包完成："
        ls -lh "${RELEASE_DIR}"
        echo "   压缩包内目录结构："
        unzip -l "${RELEASE_DIR}/${RELEASE_ZIP}" | head -30

        echo "RELEASE_DIR=${RELEASE_DIR}" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 🏷️ 生成 Release 标签与说明文件
      id: tag
      if: >-
        env.UPLOAD_RELEASE == 'true' &&
        steps.organize.outputs.status == 'success' &&
        steps.pack_release.outputs.status == 'success' &&
        !cancelled()
      run: |
        PROFILE="${{ github.event.inputs.profile }}"
        KERNEL="${{ github.event.inputs.kernel }}"
        KERNEL_VER="${KERNEL_VER}"
        SELECTED_HASH="${{ steps.smart_lock.outputs.selected_hash }}"
        REASON="${{ steps.smart_lock.outputs.selection_reason }}"

        RAW='${{ inputs.extra_packages }}'
        CUSTOM_IP=$(echo "$RAW" | grep -oP '(?<=__ip__)[^,\s]+' || true)
        CUSTOM_HOSTNAME=$(echo "$RAW" | grep -oP '(?<=__hostname__)[^,\s]+' || true)
        DISPLAY_IP=${CUSTOM_IP:-192.168.2.1}
        DISPLAY_HOSTNAME=${CUSTOM_HOSTNAME:-ImmortalWrt}

        if echo "${KERNEL_VER}" | grep -qE "^${KERNEL//./\\.}"; then
          KERNEL_MATCH_STATUS="✅ 与用户选择一致"
        else
          KERNEL_MATCH_STATUS="⚠️ 请核对（实际: ${KERNEL_VER} / 选择: ${KERNEL}）"
        fi

        RELEASE_TAG="$(date +"%Y.%m.%d-%H%M")-${PROFILE}-kernel${KERNEL}"
        echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT

        # 仅保留"编译信息"表格
        touch release.txt
        {
          echo "## 📋 编译信息"
          echo ""
          echo "| 项目 | 信息 |"
          echo "|------|------|"
          echo "| 编译者 | ${{ github.actor }} |"
          echo "| 机型 | ${PROFILE} |"
          echo "| 用户选择内核 | Linux ${KERNEL} |"
          echo "| **实际编译内核** | **${KERNEL_VER}** |"
          echo "| 版本一致性 | ${KERNEL_MATCH_STATUS} |"
          echo "| 上游提交 | \`${SELECTED_HASH:0:12}\` |"
          echo "| 提交选择策略 | ${REASON} |"
          echo "| 管理地址 | ${DISPLAY_IP} |"
          echo "| 主机名 | ${DISPLAY_HOSTNAME} |"
          echo "| 默认用户 | root |"
          echo "| 默认密码 | 空（无密码）|"
        } >> release.txt

        echo "status=success" >> $GITHUB_OUTPUT
        echo "✅ Release 说明生成完成"

    - name: 🚀 上传固件到 Releases（正式发布）
      if: >-
        env.UPLOAD_RELEASE == 'true' &&
        steps.organize.outputs.status == 'success' &&
        steps.pack_release.outputs.status == 'success' &&
        steps.tag.outputs.status == 'success' &&
        !cancelled()
      uses: ncipollo/release-action@main
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag: ${{ steps.tag.outputs.release_tag }}
        name: "ImmortalWrt ${{ github.event.inputs.profile }} kernel${{ github.event.inputs.kernel }}(${{ env.KERNEL_VER }}) ${{ env.FILE_DATE }}"
        bodyFile: release.txt
        artifacts: ${{ env.RELEASE_DIR }}/*.zip
        artifactErrorsFailBuild: false
        allowUpdates: true
        draft: false
        prerelease: false

    - name: 🗑️ 清理超过保留期的旧 Workflow 运行记录
      if: always()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RETAIN_DAYS: 7
        KEEP_MINIMUM_RUNS: 5
      run: |
        echo "🔍 查询 Workflow 运行记录..."
        RUNS=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
          "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=100")
        CUTOFF=$(date -d "-${RETAIN_DAYS} days" +%s)
        DEL_IDS=$(echo "$RUNS" | jq -r \
          --argjson cutoff "$CUTOFF" \
          --argjson keep "$KEEP_MINIMUM_RUNS" '
          [.workflow_runs[]
            | select((.created_at | fromdateiso8601) < $cutoff)
            | {id, created_at}
          ]
          | sort_by(.created_at)
          | .[:-$keep]
          | .[].id
        ')
        if [[ -z "$DEL_IDS" ]]; then
          echo "✅ 没有需要清理的旧运行记录"
        else
          echo "$DEL_IDS" | while read run_id; do
            echo "🗑️ 删除运行记录 ID: $run_id"
            curl -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$run_id"
          done
          echo "✅ 旧运行记录清理完成"
        fi
