name: 🚀 Build_imm_高通410系列

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: ' ← 选择是否开启 SSH 调试专业人员使用'
        required: false
        default: false
        type: boolean
      profile:
        description: ' ↓ 支持多款型号 手动选择要编译的机型 ↓ '
        type: choice
        options:
          - ufi001c
        default: ufi001c
        required: true
      kernel:
        description: ' ↓ 选择内核版本 ↓ '
        type: choice
        options:
          - 6.12
          - 6.18
        default: 6.12
        required: true
      upstream:
        description: ' ↓ 选择上游源码仓库 ↓ '
        type: choice
        options:
          - lkiuyu/immortalwrt
        default: lkiuyu/immortalwrt
        required: true
      custom_hash:
        description: ' ↓ 指定 hash（默认不用填写）↓ '
        required: false
        default: ''
        type: string
      extra_packages:
        description: ' ↓ 输入额外包名（逗号或空格分隔，留空则不添加任何额外包）↓ '
        required: false
        default: ''
        type: string

env:
  REPO_URL: https://github.com/${{ github.event.inputs.upstream }}
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: ${{ format('config/{0}-{1}.config', github.event.inputs.profile, github.event.inputs.kernel) }}
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:

    - name: 📥 检出仓库代码
      uses: actions/checkout@main

    - name: 🖥️ 显示编译服务器硬件信息
      run: |
        chmod 755 ./scripts/show_hardware_info.sh
        ./scripts/show_hardware_info.sh

    - name: 🧹 释放编译服务器磁盘空间
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: false
        dotnet: false
        haskell: false
        large-packages: false
        docker-images: false
        swap-storage: true

    - name: 🔧 初始化编译环境（安装系统依赖）
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -y update
        sudo -E apt-get -y install $(curl -fsSL https://raw.githubusercontent.com/xuxin1955/depend_ubuntu2204_openwrt/refs/heads/main/depend_ubuntu2204_openwrt)

    - name: 🔧 安装 mkbootimg 工具（生成 boot.img 必须）
      run: |
        wget https://github.com/xuxin1955/depend_ubuntu2204_openwrt/releases/download/ubuntu_26.04_LTS_mkbootimg/mkbootimg_34.0.5-12build1_all.deb
        sudo dpkg -i mkbootimg_34.0.5-12build1_all.deb
        sudo apt-get install -f -y
        mkbootimg --help || true
        MKBOOTIMG_PATH=$(which mkbootimg)
        if [ -n "$MKBOOTIMG_PATH" ]; then
          echo "mkbootimg 安装成功: $MKBOOTIMG_PATH"
          file "$MKBOOTIMG_PATH"
        else
          echo "❌ mkbootimg 未找到，请检查安装步骤！"
        fi
        sudo timedatectl set-timezone "$TZ"
        sudo chmod 777 /mnt
        df -hT

    - name: 🐍 安装 Python 编译工具链
      run: |
        python3 -m pip cache purge
        python3 -m pip install --upgrade --force-reinstall pip
        python3 -m pip install --upgrade --force-reinstall 'setuptools>=65' wheel
        python3 -m pip install --upgrade 'setuptools-scm>=8,<10'
        python3 -m pip install --upgrade cython packaging tomli
        python3 -m pip install Unidecode pyelftools
        python3 -m pip --version
        python3 -c "import setuptools.build_meta; print('setuptools.build_meta OK')"

    - name: 🔒 读取上游源码版本锁定信息
      id: lock
      run: |
        CUSTOM_HASH="${{ github.event.inputs.custom_hash }}"
        LOCK_FILE="upstream_lock.txt"
        if [ -n "$CUSTOM_HASH" ]; then
          echo "locked_hash=$CUSTOM_HASH" >> $GITHUB_OUTPUT
          echo "✅ 使用用户指定 hash: $CUSTOM_HASH"
        elif [ -f "$LOCK_FILE" ]; then
          HASH=$(cat $LOCK_FILE)
          echo "locked_hash=$HASH" >> $GITHUB_OUTPUT
          echo "✅ 使用锁定 hash: $HASH"
        else
          echo "locked_hash=" >> $GITHUB_OUTPUT
          echo "⚠️ upstream_lock.txt 不存在，将使用最新 master 分支"
        fi

    - name: 📦 拉取上游 ImmortalWrt 源码
      working-directory: /mnt
      run: |
        df -hT $PWD
        echo "📡 正在克隆: $REPO_URL 分支: $REPO_BRANCH"
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        if [ -n "${{ steps.lock.outputs.locked_hash }}" ]; then
          echo "🔒 切换到锁定 hash: ${{ steps.lock.outputs.locked_hash }}"
          cd openwrt && git checkout ${{ steps.lock.outputs.locked_hash }}
        fi
        ln -sf /mnt/openwrt $GITHUB_WORKSPACE/openwrt
        echo "✅ 源码克隆完成"

    - name: 📝 加载自定义 feeds 源并执行前置脚本
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default && echo "✅ 已替换 feeds.conf.default"
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH
        echo "✅ diy-part1.sh 执行完成"

    - name: 🔄 更新所有 feeds 软件包索引
      run: |
        cd openwrt
        ./scripts/feeds update -a
        echo "✅ feeds 更新完成"

    - name: 🗑️ 删除 smpackage 与官方 feeds 中的冲突包
      run: |
        echo "🗑️ 删除 smpackage 自身携带的系统基础包..."
        rm -rf openwrt/feeds/smpackage/{base-files,dnsmasq,firewall*,fullconenat,libnftnl,nftables,ppp,opkg,ucl,upx,vsftpd*,miniupnpd-iptables,wireless-regdb}

        echo "🗑️ 删除 luci feed 中与 smpackage 冲突的包..."
        rm -rf openwrt/feeds/luci/applications/luci-app-mosdns

        echo "🗑️ 删除 packages feed 中与 smpackage 冲突的包..."
        rm -rf openwrt/feeds/packages/net/{alist,adguardhome,mosdns,xray-core,xray-plugin,v2ray-core,v2ray-geodata,sing-box,smartdns}
        rm -rf openwrt/feeds/packages/utils/v2dat

        echo "🔄 替换 golang 为 kenzok8 维护版本..."
        rm -rf openwrt/feeds/packages/lang/golang
        git clone https://github.com/kenzok8/golang -b 1.26 openwrt/feeds/packages/lang/golang
        echo "✅ 冲突包处理完成"

    - name: 📦 安装所有 feeds 软件包
      run: |
        cd openwrt
        ./scripts/feeds install -a -f
        echo "✅ feeds 安装完成"

    - name: ⚙️ 加载自定义配置文件并执行后置脚本
      run: |
        [ -e files ] && mv files openwrt/files && echo "✅ 已复制 files/ 目录到源码"
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config && echo "✅ 已加载编译配置: $CONFIG_FILE"
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH
        echo "✅ diy-part2.sh 执行完成"

    - name: ➕ 安装用户在触发时输入的额外软件包
      if: ${{ inputs.extra_packages != '' }}
      run: |
        cd openwrt
        echo "=========================================="
        echo "📦 用户请求的额外包："
        echo "${{ inputs.extra_packages }}"
        echo "=========================================="

        RAW='${{ inputs.extra_packages }}'
        CUSTOM_IP=$(echo "$RAW" | grep -oP '(?<=__ip__)[^,\s]+' || true)
        CUSTOM_HOSTNAME=$(echo "$RAW" | grep -oP '(?<=__hostname__)[^,\s]+' || true)

        if [ -n "$CUSTOM_IP" ]; then
          echo "🌐 设置管理 IP: $CUSTOM_IP"
          sed -i "s/192\.168\.2\.1/$CUSTOM_IP/g" package/base-files/files/bin/config_generate
        fi

        if [ -n "$CUSTOM_HOSTNAME" ]; then
          echo "🏷️ 设置主机名: $CUSTOM_HOSTNAME"
          sed -i "s/set system\.@system\[0\]\.hostname='ImmortalWrt'/set system.@system[0].hostname='$CUSTOM_HOSTNAME'/" package/base-files/files/bin/config_generate || true
          sed -i "s/option hostname 'ImmortalWrt'/option hostname '$CUSTOM_HOSTNAME'/" package/base-files/files/etc/config/system 2>/dev/null || true
        fi

        PACKAGES=$(echo "$RAW" | sed 's/,/ /g' | tr ' ' '\n' | grep -v '^__ip__' | grep -v '^__hostname__' | tr '\n' ' ')

        if echo "$PACKAGES" | grep -qw "luci-app-turboacc"; then
          echo "⚡ 检测到 luci-app-turboacc，执行 turboacc 安装脚本..."
          curl -sSL https://raw.githubusercontent.com/mufeng05/turboacc/main/add_turboacc.sh -o add_turboacc.sh && bash add_turboacc.sh || echo "⚠️ turboacc 脚本执行失败，跳过"
        fi

        for pkg in $PACKAGES; do
          if [ -n "$pkg" ]; then
            CFG="CONFIG_PACKAGE_${pkg}"
            if grep -q "^# ${CFG} is not set" .config; then
              sed -i "s/^# ${CFG} is not set$/${CFG}=y/" .config
              echo "✅ 已启用（替换）: ${CFG}=y"
            elif grep -q "^${CFG}=" .config; then
              sed -i "s/^${CFG}=.*$/${CFG}=y/" .config
              echo "✅ 已启用（更新）: ${CFG}=y"
            else
              echo "${CFG}=y" >> .config
              echo "✅ 已启用（追加）: ${CFG}=y"
            fi
          fi
        done
        echo "✅ 额外包处理完成"

    - name: 🐛 SSH 远程调试（有效时间 6h，输入 exit 退出继续编译）
      uses: mxschmitt/action-tmate@master
      if: ${{ inputs.ssh || contains(github.event.action, 'ssh') }}

    - name: 🔨 生成最终编译配置（make defconfig）
      id: config
      run: |
        cd openwrt
        make defconfig
        echo "✅ defconfig 生成完成，配置项数量："
        grep -c '=y' .config || true

    - name: ⬇️ 下载编译所需的软件包源码
      id: package
      run: |
        cd openwrt
        echo "📡 开始下载依赖包..."
        make download -j4 V=s
        echo "🔍 检查并清理下载不完整的文件..."
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;
        echo "✅ 软件包下载完成"

    - name: 📤 上传 defconfig 编译配置（供调试参考）
      uses: actions/upload-artifact@main
      with:
        name: build-config-${{ github.event.inputs.profile }}-kernel${{ github.event.inputs.kernel }}
        path: |
          ${{ github.workspace }}/openwrt/.config
          ${{ github.workspace }}/openwrt/feeds.conf.default
        include-hidden-files: true

    - name: 🚀 开始编译固件（多线程，失败自动回退单线程）
      id: compile
      run: |
        cd openwrt
        echo "🔧 使用 $(nproc) 线程编译..."
        echo "📌 内核版本: ${{ github.event.inputs.kernel }}"
        make -j$(nproc) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
        echo "✅ 固件编译完成！"

    - name: 🔍 获取编译固件的内核版本
      run: |
        KERNEL_VER=$(cat /mnt/openwrt/build_dir/target-*/linux-*/linux-*/.kernelversion 2>/dev/null | head -1 || echo "未知")
        echo "KERNEL_VER=$KERNEL_VER" >> $GITHUB_ENV
        echo "📌 内核版本: $KERNEL_VER"

    - name: 💾 查看编译服务器剩余磁盘空间
      if: (!cancelled())
      run: df -hT

    - name: 🔧 修复 Git 大文件上传缓冲区
      run: git config --global http.postBuffer 524288000

    - name: 📦 上传完整 bin 目录（仅 UPLOAD_BIN_DIR=true 时生效）
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}_kernel${{ github.event.inputs.kernel }}
        path: openwrt/bin

    - name: 📁 整理固件输出文件（提取 boot.img + rootfs.img）
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        PROFILE=${{ github.event.inputs.profile }}
        KERNEL=${{ github.event.inputs.kernel }}

        echo "🔍 查找固件文件..."
        ls -la

        BOOT_IMG=$(ls *boot.img.gz *boot.img 2>/dev/null | head -1)
        SYSTEM_IMG=$(ls *system.img.gz *system.img *rootfs.img.gz *rootfs.img 2>/dev/null | head -1)

        if [ -z "$BOOT_IMG" ] || [ -z "$SYSTEM_IMG" ]; then
          echo "::error::❌ 固件文件未找到！当前目录："
          ls -la
          exit 1
        fi

        echo "✅ 找到 boot 文件: $BOOT_IMG"
        echo "✅ 找到 rootfs 文件: $SYSTEM_IMG"

        mkdir -p firmware_output

        if echo "$BOOT_IMG" | grep -q '\.gz$'; then
          gzip -dk "$BOOT_IMG"
          cp "${BOOT_IMG%.gz}" firmware_output/boot.img
        else
          cp "$BOOT_IMG" firmware_output/boot.img
        fi

        if echo "$SYSTEM_IMG" | grep -q '\.gz$'; then
          gzip -dk "$SYSTEM_IMG"
          cp "${SYSTEM_IMG%.gz}" firmware_output/rootfs.img
        else
          cp "$SYSTEM_IMG" firmware_output/rootfs.img
        fi

        cp *.manifest firmware_output/ 2>/dev/null || true
        cp sha256sums firmware_output/ 2>/dev/null || true

        echo "✅ 固件输出文件清单："
        ls -lh firmware_output/

        echo "FIRMWARE=$PWD/firmware_output" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 📤 上传固件到 Artifacts（临时下载用）
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}_kernel${{ github.event.inputs.kernel }}
        path: ${{ env.FIRMWARE }}

    - name: 🏷️ 生成 Release 标签与说明文件
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success' && !cancelled()
      run: |
        PROFILE=${{ github.event.inputs.profile }}
        KERNEL=${{ github.event.inputs.kernel }}
        RAW='${{ inputs.extra_packages }}'
        CUSTOM_IP=$(echo "$RAW" | grep -oP '(?<=__ip__)[^,\s]+' || true)
        CUSTOM_HOSTNAME=$(echo "$RAW" | grep -oP '(?<=__hostname__)[^,\s]+' || true)
        DISPLAY_IP=${CUSTOM_IP:-192.168.2.1}
        DISPLAY_HOSTNAME=${CUSTOM_HOSTNAME:-ImmortalWrt}
        EXTRA=$(echo "$RAW" | sed 's/,/ /g' | tr ' ' '\n' \
          | grep -v '^__ip__' | grep -v '^__hostname__' | sed '/^$/d')

        echo "release_tag=$(date +"%Y.%m.%d-%H%M")-${PROFILE}-kernel${KERNEL}" >> $GITHUB_OUTPUT
        touch release.txt
        {
          echo "## Immortalwrt master 分支 · 高通410系列 · ${PROFILE} · 内核 ${KERNEL}"
          echo ""
          echo "| 项目 | 信息 |"
          echo "|------|------|"
          echo "| 编译者 | ${{ github.actor }} |"
          echo "| 机型 | ${PROFILE} |"
          echo "| 内核选择 | Linux ${KERNEL} |"
          echo "| 实际内核版本 | ${{ env.KERNEL_VER }} |"
          echo "| 管理地址 | ${DISPLAY_IP} |"
          echo "| 主机名 | ${DISPLAY_HOSTNAME} |"
          echo "| 默认用户 | root |"
          echo "| 默认密码 | 空（无密码）|"
          echo ""
          echo "### 📦 固件文件说明"
          echo "| 文件名 | 用途 |"
          echo "|--------|------|"
          echo "| boot.img | 引导分区镜像（刷入 boot 分区）|"
          echo "| rootfs.img | 系统根文件系统镜像（刷入 system 分区）|"
          echo ""
          echo "### 🔧 内核差异说明"
          echo "| 内核 | USB 切换接口 | DEBUG_FS | USB_OTG_FSM |"
          echo "|------|------------|----------|-------------|"
          echo "| 6.12 | /sys/class/usb_role/ | ❌ | ❌ |"
          echo "| 6.18 | /sys/kernel/debug/usb/ | ✅ | ✅ |"
          echo ""
          if [ -n "$EXTRA" ]; then
            echo "### ➕ 本次额外添加的包"
            echo "$EXTRA" | sed 's/^/- /'
          else
            echo "### ➕ 本次额外添加的包"
            echo "无"
          fi
        } >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT
        echo "✅ Release 说明文件生成完成"

    - name: 📋 生成固件文件清单
      if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success' && !cancelled()
      run: |
        find ${{ env.FIRMWARE }} -type f > file_list.txt
        echo "📋 待上传文件清单："
        cat file_list.txt
        test -s file_list.txt || { echo "::error::❌ 未找到固件文件！"; exit 1; }

    - name: 🚀 上传固件到 Releases（正式发布）
      if: env.UPLOAD_RELEASE == 'true' && steps.organize.outputs.status == 'success' && steps.tag.outputs.status == 'success' && !cancelled()
      uses: ncipollo/release-action@main
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag: ${{ steps.tag.outputs.release_tag }}
        name: "ImmortalWrt ${{ github.event.inputs.profile }} kernel${{ github.event.inputs.kernel }} ${{ env.FILE_DATE }}"
        bodyFile: release.txt
        artifacts: ${{ env.FIRMWARE }}/**/*
        artifactErrorsFailBuild: false
        allowUpdates: true
        draft: false
        prerelease: false

    - name: 🗑️ 清理超过保留期的旧 Workflow 运行记录
      if: always()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RETAIN_DAYS: 7
        KEEP_MINIMUM_RUNS: 5
      run: |
        echo "🔍 查询 Workflow 运行记录..."
        RUNS=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
          "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=100")
        CUTOFF=$(date -d "-${RETAIN_DAYS} days" +%s)
        DEL_IDS=$(echo "$RUNS" | jq -r --arg cutoff "$CUTOFF" --argjson keep "$KEEP_MINIMUM_RUNS" '
          [.workflow_runs[]
            | select((now - (.created_at | fromdateiso8601)) > ($cutoff | tonumber))
            | {id, created_at}
          ]
          | sort_by(.created_at)
          | .[:-$keep]
          | .[].id
        ')
        if [[ -z "$DEL_IDS" ]]; then
          echo "✅ 没有需要清理的旧运行记录"
        else
          echo "$DEL_IDS" | while read run_id; do
            echo "🗑️ 正在删除运行记录 ID: $run_id"
            curl -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$run_id"
          done
          echo "✅ 旧运行记录清理完成"
        fi
