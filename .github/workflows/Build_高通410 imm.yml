name: 🚀 Build_imm_高通410系列

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      ssh:
        description: ' ← 选择是否开启 SSH 调试专业人员使用'
        required: false
        default: false
        type: boolean
      profile:
        description: ' ↓ 支持多款型号 手动选择要编译的机型 ↓ '
        type: choice
        options:
          - ufi001c
        default: ufi001c
        required: true
      kernel:
        description: ' ↓ 选择内核版本（自动匹配上游支持的提交）↓ '
        type: choice
        options:
          - 6.18
          - 6.12
          - 6.6
        default: 6.18
        required: true
      upstream:
        description: ' ↓ 选择上游源码仓库 ↓ '
        type: choice
        options:
          - lkiuyu/immortalwrt
        default: lkiuyu/immortalwrt
        required: true
      custom_hash:
        description: ' ↓ 高级选项：手动指定 hash（留空由系统自动选择）↓ '
        required: false
        default: ''
        type: string
      extra_packages:
        description: ' ↓ 输入额外包名（逗号或空格分隔，留空则不添加）↓ '
        required: false
        default: ''
        type: string

env:
  REPO_URL: https://github.com/${{ github.event.inputs.upstream }}
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: ${{ format('config/{0}-{1}.config', github.event.inputs.profile, github.event.inputs.kernel) }}
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write

    steps:

    - name: 📥 检出仓库代码
      uses: actions/checkout@main

    - name: 🖥️ 显示编译服务器硬件信息
      run: |
        chmod 755 ./scripts/show_hardware_info.sh
        ./scripts/show_hardware_info.sh

    - name: 🧹 释放编译服务器磁盘空间
      uses: jlumbroso/free-disk-space@main
      with:
        tool-cache: false
        android: false
        dotnet: false
        haskell: false
        large-packages: false
        docker-images: false
        swap-storage: true

    - name: 🔧 初始化编译环境（安装系统依赖）
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo -E apt-get -y update
        sudo -E apt-get -y install $(curl -fsSL https://raw.githubusercontent.com/xuxin1955/depend_ubuntu2204_openwrt/refs/heads/main/depend_ubuntu2204_openwrt)

    - name: 🔧 安装 mkbootimg 工具（生成 boot.img 必须）
      run: |
        wget https://github.com/xuxin1955/depend_ubuntu2204_openwrt/releases/download/ubuntu_26.04_LTS_mkbootimg/mkbootimg_34.0.5-12build1_all.deb
        sudo dpkg -i mkbootimg_34.0.5-12build1_all.deb
        sudo apt-get install -f -y
        mkbootimg --help || true
        MKBOOTIMG_PATH=$(which mkbootimg)
        if [ -n "$MKBOOTIMG_PATH" ]; then
          echo "✅ mkbootimg 安装成功: $MKBOOTIMG_PATH"
        else
          echo "❌ mkbootimg 未找到，请检查安装步骤！"
        fi
        sudo timedatectl set-timezone "$TZ"
        sudo chmod 777 /mnt
        df -hT

    - name: 🐍 安装 Python 编译工具链
      run: |
        python3 -m pip cache purge
        python3 -m pip install --upgrade --force-reinstall pip
        python3 -m pip install --upgrade --force-reinstall 'setuptools>=65' wheel
        python3 -m pip install --upgrade 'setuptools-scm>=8,<10'
        python3 -m pip install --upgrade cython packaging tomli
        python3 -m pip install Unidecode pyelftools
        python3 -m pip --version
        python3 -c "import setuptools.build_meta; print('setuptools.build_meta OK')"

    - name: 🧠 智能选择支持目标内核的上游提交
      id: smart_lock
      working-directory: /mnt
      run: |
        KERNEL="${{ github.event.inputs.kernel }}"
        CUSTOM_HASH="${{ github.event.inputs.custom_hash }}"
        LOCK_FILE="${GITHUB_WORKSPACE}/upstream_lock.txt"
        TARGET_CONFIG="target/linux/msm89xx/config-${KERNEL}"
        TARGET_MAKEFILE="target/linux/msm89xx/Makefile"

        echo "=================================================="
        echo "🎯 目标内核版本: Linux ${KERNEL}"
        echo "=================================================="

        # --------------------------------------------------
        # 优先级 1：用户手动指定 hash
        # --------------------------------------------------
        if [ -n "$CUSTOM_HASH" ]; then
          echo "🔑 优先级1：使用用户手动指定的 hash"
          echo "   Hash: $CUSTOM_HASH"
          echo "selected_hash=$CUSTOM_HASH" >> $GITHUB_OUTPUT
          echo "selection_reason=用户手动指定" >> $GITHUB_OUTPUT
          exit 0
        fi

        # --------------------------------------------------
        # 优先级 2：upstream_lock.txt 中的 hash（过滤注释行）
        # ✅ 修复：支持注释行（# 开头），普通用户无需理会此文件
        # --------------------------------------------------
        if [ -f "$LOCK_FILE" ]; then
          LOCKED_HASH=$(grep -v '^#' "$LOCK_FILE" \
            | grep -v '^[[:space:]]*$' \
            | head -1 \
            | tr -d '[:space:]')
          if [ -n "$LOCKED_HASH" ]; then
            echo "🔒 优先级2：检测到 upstream_lock.txt，hash: $LOCKED_HASH"
            echo "   ⚠️ 将验证此 hash 是否支持 Linux ${KERNEL}..."
            echo "selected_hash=$LOCKED_HASH" >> $GITHUB_OUTPUT
            echo "selection_reason=upstream_lock.txt 锁定" >> $GITHUB_OUTPUT
            exit 0
          fi
        fi

        # --------------------------------------------------
        # 优先级 3：自动从上游 git 历史智能查找
        # 策略：克隆最近 200 条 commits 历史，从新到旧遍历
        # 找到第一个同时满足：
        #   a. 存在 target/linux/msm89xx/config-${KERNEL}
        #   b. target/linux/msm89xx/Makefile 中 KERNEL_PATCHVER 为该版本
        #      （或仅满足 a，即文件存在即可编译）
        # --------------------------------------------------
        echo "🤖 优先级3：自动智能查找支持 Linux ${KERNEL} 的最新上游提交..."
        echo ""

        # 浅克隆最近 200 条历史（节省时间和空间）
        echo "📡 克隆上游仓库历史（depth=200）..."
        git clone \
          --depth=200 \
          --no-checkout \
          --filter=blob:none \
          ${{ env.REPO_URL }} \
          upstream_search
        cd upstream_search

        echo "🔍 开始从最新提交向前遍历，查找支持 Linux ${KERNEL} 的提交..."
        echo ""

        FOUND_HASH=""
        FOUND_PATCHVER=""
        COMMIT_COUNT=0
        CHECKED_COUNT=0

        # 获取所有提交 hash（从新到旧）
        ALL_COMMITS=$(git log --format="%H" origin/master)
        TOTAL=$(echo "$ALL_COMMITS" | wc -l)
        echo "📊 共获取 $TOTAL 条历史提交，开始逐一验证..."

        for commit_hash in $ALL_COMMITS; do
          COMMIT_COUNT=$((COMMIT_COUNT + 1))
          CHECKED_COUNT=$((CHECKED_COUNT + 1))

          # 检查此提交中 config-${KERNEL} 是否存在
          CONFIG_EXISTS=$(git ls-tree -r "$commit_hash" \
            --name-only 2>/dev/null \
            | grep -c "^${TARGET_CONFIG}$" || true)

          if [ "$CONFIG_EXISTS" -gt "0" ]; then
            # config 文件存在，进一步获取 KERNEL_PATCHVER 值
            PATCHVER=$(git show "${commit_hash}:${TARGET_MAKEFILE}" 2>/dev/null \
              | grep "^KERNEL_PATCHVER" \
              | cut -d= -f2 \
              | tr -d '[:space:]' || echo "")

            echo "  ✅ 找到候选提交 #${COMMIT_COUNT}: ${commit_hash:0:12}"
            echo "     KERNEL_PATCHVER=${PATCHVER} | config-${KERNEL} 存在"

            FOUND_HASH="$commit_hash"
            FOUND_PATCHVER="$PATCHVER"

            # 优先选择 KERNEL_PATCHVER 完全匹配的提交
            if [ "$PATCHVER" = "$KERNEL" ]; then
              echo "  🎯 KERNEL_PATCHVER 精确匹配 ${KERNEL}，直接使用此提交！"
              break
            else
              echo "  ℹ️  KERNEL_PATCHVER=${PATCHVER} 不匹配，但 config-${KERNEL} 存在"
              echo "     继续查找精确匹配提交（最多再查 20 个）..."
              # 继续查找精确匹配，但最多再往前找 20 个
              if [ "$CHECKED_COUNT" -gt "20" ]; then
                echo "  ⏱ 超过额外查找限制，使用当前最佳候选"
                break
              fi
            fi
          fi
        done

        cd ..

        if [ -z "$FOUND_HASH" ]; then
          echo ""
          echo "::error::❌ 在最近 ${TOTAL} 条提交历史中未找到支持 Linux ${KERNEL} 的提交！"
          echo "::error::可能原因："
          echo "::error::  1. 上游 lkiuyu/immortalwrt 尚未添加对 Linux ${KERNEL} 的支持"
          echo "::error::  2. 克隆深度不足（当前 depth=200）"
          echo "::error::解决方案：请改选其他内核版本（6.12 或 6.18）"
          exit 1
        fi

        echo ""
        echo "=================================================="
        echo "✅ 智能选择结果："
        echo "   Hash:           ${FOUND_HASH}"
        echo "   短 Hash:        ${FOUND_HASH:0:12}"
        echo "   上游 PATCHVER:  ${FOUND_PATCHVER}"
        echo "   目标内核:       ${KERNEL}"
        echo "   config 文件:    ${TARGET_CONFIG} ✅ 存在"
        echo "=================================================="

        echo "selected_hash=${FOUND_HASH}" >> $GITHUB_OUTPUT
        echo "selection_reason=自动智能匹配（上游 PATCHVER=${FOUND_PATCHVER}）" >> $GITHUB_OUTPUT

    - name: 📦 拉取上游 ImmortalWrt 源码（使用智能选定的提交）
      working-directory: /mnt
      run: |
        df -hT $PWD
        SELECTED_HASH="${{ steps.smart_lock.outputs.selected_hash }}"
        REASON="${{ steps.smart_lock.outputs.selection_reason }}"

        echo "=================================================="
        echo "📡 克隆上游源码: ${{ env.REPO_URL }}"
        echo "   分支: ${{ env.REPO_BRANCH }}"
        echo "   选择策略: ${REASON}"
        echo "   目标 Hash: ${SELECTED_HASH:0:12}..."
        echo "=================================================="

        git clone ${{ env.REPO_URL }} -b ${{ env.REPO_BRANCH }} openwrt

        if [ -n "$SELECTED_HASH" ]; then
          echo "🔒 切换到选定提交: ${SELECTED_HASH:0:12}..."
          cd openwrt
          git checkout "$SELECTED_HASH"
          echo "✅ 已切换到提交: $(git log --oneline -1)"
        fi

        ln -sf /mnt/openwrt $GITHUB_WORKSPACE/openwrt
        echo "✅ 源码准备完成"

    # =========================================================
    # ✅ Bug 24 核心修复：动态设置 KERNEL_PATCHVER
    # 依据：target/linux/msm89xx/Makefile 中的 KERNEL_PATCHVER
    # 是 OpenWrt 构建系统中唯一真正决定编译哪个内核的配置项
    # .config 文件对内核版本选择完全无效
    # 不修改此项则无论用户选 6.6/6.12/6.18 均编译同一内核
    # =========================================================
    - name: 🔧 设置内核版本并三重验证
      run: |
        KERNEL="${{ github.event.inputs.kernel }}"
        MAKEFILE="openwrt/target/linux/msm89xx/Makefile"
        UPSTREAM_CONFIG="openwrt/target/linux/msm89xx/config-${KERNEL}"
        USER_CONFIG="${{ env.CONFIG_FILE }}"

        echo "=================================================="
        echo "🔧 内核版本设置与验证"
        echo "=================================================="

        # --- 验证 1：用户 config 文件是否存在 ---
        echo ""
        echo "📋 验证1：用户编译配置文件"
        if [ ! -f "${GITHUB_WORKSPACE}/${USER_CONFIG}" ]; then
          echo "::error::❌ 用户 config 不存在: ${USER_CONFIG}"
          echo "::error::仓库中需要存在以下文件之一："
          echo "::error::  config/ufi001c-6.6.config"
          echo "::error::  config/ufi001c-6.12.config"
          echo "::error::  config/ufi001c-6.18.config"
          exit 1
        fi
        echo "  ✅ 用户配置文件存在: ${USER_CONFIG}"

        # --- 验证 2：上游源码中 config-X.XX 是否存在 ---
        echo ""
        echo "📋 验证2：上游内核配置文件"
        echo "  当前上游支持的所有内核版本："
        ls openwrt/target/linux/msm89xx/config-* 2>/dev/null \
          | while read f; do
              VER=$(basename "$f" | sed 's/config-//')
              if [ "$VER" = "$KERNEL" ]; then
                echo "    ✅ Linux ${VER}  ← 当前选择"
              else
                echo "    ℹ️  Linux ${VER}"
              fi
            done

        if [ ! -f "$UPSTREAM_CONFIG" ]; then
          echo "::error::❌ 上游不包含 config-${KERNEL}，无法编译此内核版本！"
          exit 1
        fi
        echo "  ✅ 上游 config-${KERNEL} 存在"

        # --- 核心操作：修改 KERNEL_PATCHVER ---
        echo ""
        echo "📋 修改 KERNEL_PATCHVER:"
        echo "  修改前: $(grep 'KERNEL_PATCHVER' $MAKEFILE)"
        sed -i "s/^KERNEL_PATCHVER:=.*/KERNEL_PATCHVER:=${KERNEL}/" "$MAKEFILE"
        echo "  修改后: $(grep 'KERNEL_PATCHVER' $MAKEFILE)"

        # --- 验证 3：KERNEL_PATCHVER 修改是否成功 ---
        echo ""
        echo "📋 验证3：KERNEL_PATCHVER 写入确认"
        ACTUAL=$(grep "^KERNEL_PATCHVER" "$MAKEFILE" \
          | cut -d= -f2 \
          | tr -d '[:space:]')
        if [ "$ACTUAL" != "${KERNEL}" ]; then
          echo "::error::❌ KERNEL_PATCHVER 写入失败！"
          echo "::error::期望: ${KERNEL}，实际读回: ${ACTUAL}"
          exit 1
        fi
        echo "  ✅ KERNEL_PATCHVER 已确认写入: ${ACTUAL}"

        echo ""
        echo "=================================================="
        echo "✅ 三重验证全部通过！"
        echo "   将编译: Linux ${KERNEL} for ufi001c"
        echo "   用户配置: ${USER_CONFIG}"
        echo "   上游 config: config-${KERNEL}"
        echo "   KERNEL_PATCHVER: ${ACTUAL}"
        echo "=================================================="

    - name: 📝 加载自定义 feeds 源并执行前置脚本
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default \
          && echo "✅ 已替换 feeds.conf.default"
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH
        echo "✅ diy-part1.sh 执行完成"

    - name: 🔄 更新所有 feeds 软件包索引
      run: |
        cd openwrt
        ./scripts/feeds update -a
        echo "✅ feeds 更新完成"

    - name: 🗑️ 删除 smpackage 与官方 feeds 中的冲突包
      run: |
        echo "🗑️ 删除 smpackage 自身携带的系统基础包..."
        rm -rf openwrt/feeds/smpackage/{base-files,dnsmasq,firewall*,fullconenat,\
        libnftnl,nftables,ppp,opkg,ucl,upx,vsftpd*,miniupnpd-iptables,wireless-regdb}

        echo "🗑️ 删除 luci feed 中与 smpackage 冲突的包..."
        rm -rf openwrt/feeds/luci/applications/luci-app-mosdns

        echo "🗑️ 删除 packages feed 中与 smpackage 冲突的包..."
        rm -rf openwrt/feeds/packages/net/{alist,adguardhome,mosdns,\
        xray-core,xray-plugin,v2ray-core,v2ray-geodata,sing-box,smartdns}
        rm -rf openwrt/feeds/packages/utils/v2dat

        # ✅ 修复：添加 fallback，若 1.26 分支不存在则克隆默认分支
        echo "🔄 替换 golang 为 kenzok8 维护版本..."
        rm -rf openwrt/feeds/packages/lang/golang
        git clone https://github.com/kenzok8/golang \
          -b 1.26 openwrt/feeds/packages/lang/golang \
          || git clone https://github.com/kenzok8/golang \
               openwrt/feeds/packages/lang/golang
        echo "✅ 冲突包处理完成"

    - name: 📦 安装所有 feeds 软件包
      run: |
        cd openwrt
        ./scripts/feeds install -a -f
        echo "✅ feeds 安装完成"

    - name: ⚙️ 加载自定义配置文件并执行后置脚本
      run: |
        [ -e files ] && mv files openwrt/files \
          && echo "✅ 已复制 files/ 目录到源码"

        # ✅ 修复：文件已在"三重验证"步骤确认存在，此处直接加载
        mv "$CONFIG_FILE" openwrt/.config
        echo "✅ 已加载编译配置: $CONFIG_FILE"

        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH
        echo "✅ diy-part2.sh 执行完成"

    - name: ➕ 安装用户在触发时输入的额外软件包
      if: ${{ inputs.extra_packages != '' }}
      run: |
        cd openwrt
        echo "=========================================="
        echo "📦 用户请求的额外包："
        echo "${{ inputs.extra_packages }}"
        echo "=========================================="

        RAW='${{ inputs.extra_packages }}'
        CUSTOM_IP=$(echo "$RAW" | grep -oP '(?<=__ip__)[^,\s]+' || true)
        CUSTOM_HOSTNAME=$(echo "$RAW" | grep -oP '(?<=__hostname__)[^,\s]+' || true)

        if [ -n "$CUSTOM_IP" ]; then
          echo "🌐 设置管理 IP: $CUSTOM_IP"
          sed -i "s/192\.168\.2\.1/$CUSTOM_IP/g" \
            package/base-files/files/bin/config_generate
        fi

        if [ -n "$CUSTOM_HOSTNAME" ]; then
          echo "🏷️ 设置主机名: $CUSTOM_HOSTNAME"
          sed -i "s/set system\.@system\[0\]\.hostname='ImmortalWrt'\
            /set system.@system[0].hostname='$CUSTOM_HOSTNAME'/" \
            package/base-files/files/bin/config_generate || true
          sed -i "s/option hostname 'ImmortalWrt'\
            /option hostname '$CUSTOM_HOSTNAME'/" \
            package/base-files/files/etc/config/system 2>/dev/null || true
        fi

        PACKAGES=$(echo "$RAW" | sed 's/,/ /g' | tr ' ' '\n' \
          | grep -v '^__ip__' \
          | grep -v '^__hostname__' \
          | tr '\n' ' ')

        if echo "$PACKAGES" | grep -qw "luci-app-turboacc"; then
          echo "⚡ 检测到 luci-app-turboacc，执行 turboacc 安装脚本..."
          curl -sSL \
            https://raw.githubusercontent.com/mufeng05/turboacc/main/add_turboacc.sh \
            -o add_turboacc.sh \
            && bash add_turboacc.sh \
            || echo "⚠️ turboacc 脚本执行失败，跳过"
        fi

        for pkg in $PACKAGES; do
          if [ -n "$pkg" ]; then
            CFG="CONFIG_PACKAGE_${pkg}"
            if grep -q "^# ${CFG} is not set" .config; then
              sed -i "s/^# ${CFG} is not set$/${CFG}=y/" .config
              echo "✅ 已启用（替换）: ${CFG}=y"
            elif grep -q "^${CFG}=" .config; then
              sed -i "s/^${CFG}=.*$/${CFG}=y/" .config
              echo "✅ 已启用（更新）: ${CFG}=y"
            else
              echo "${CFG}=y" >> .config
              echo "✅ 已启用（追加）: ${CFG}=y"
            fi
          fi
        done
        echo "✅ 额外包处理完成"

    - name: 🐛 SSH 远程调试（有效时间 6h，输入 exit 退出继续编译）
      uses: mxschmitt/action-tmate@master
      if: ${{ inputs.ssh || contains(github.event.action, 'ssh') }}

    - name: 🔨 生成最终编译配置（make defconfig）
      id: config
      run: |
        cd openwrt
        make defconfig
        echo "✅ defconfig 生成完成"

        # 最终确认内核版本写入情况
        echo ""
        echo "📋 最终 .config 内核相关配置："
        grep -E "KERNEL_PATCHVER|CONFIG_LINUX_" .config 2>/dev/null \
          | head -10 || echo "（使用 Makefile KERNEL_PATCHVER 控制，.config 无需额外项）"

        echo "📋 编译包数量: $(grep -c '=y' .config || true)"

    - name: ⬇️ 下载编译所需的软件包源码
      id: package
      run: |
        cd openwrt
        echo "📡 开始下载依赖包..."
        make download -j4 V=s
        echo "🔍 检查并清理下载不完整的文件..."
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;
        echo "✅ 软件包下载完成"

    - name: 📤 上传 defconfig 编译配置（供调试参考）
      uses: actions/upload-artifact@main
      with:
        name: >-
          build-config-${{ github.event.inputs.profile
          }}-kernel${{ github.event.inputs.kernel }}
        path: |
          ${{ github.workspace }}/openwrt/.config
          ${{ github.workspace }}/openwrt/feeds.conf.default
          ${{ github.workspace }}/openwrt/target/linux/msm89xx/Makefile
        include-hidden-files: true

    - name: 🚀 开始编译固件（多线程，失败自动回退单线程）
      id: compile
      run: |
        cd openwrt
        echo "🔧 使用 $(nproc) 线程编译..."
        echo "📌 内核版本: ${{ github.event.inputs.kernel }}"
        make -j$(nproc) || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config \
          | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] \
          && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV
        echo "✅ 固件编译完成！"

    - name: 🔍 获取编译固件的实际内核版本
      run: |
        KERNEL_VER=$(cat /mnt/openwrt/build_dir/target-*/linux-*/linux-*/.kernelversion \
          2>/dev/null | head -1 || echo "未知")
        echo "KERNEL_VER=$KERNEL_VER" >> $GITHUB_ENV
        echo "📌 实际编译内核版本: $KERNEL_VER"

        # 验证实际编译内核与用户选择是否一致
        SELECTED="${{ github.event.inputs.kernel }}"
        if echo "$KERNEL_VER" | grep -q "^${SELECTED}"; then
          echo "✅ 实际内核版本 ${KERNEL_VER} 与选择 ${SELECTED} 一致"
        else
          echo "⚠️ 注意：实际内核 ${KERNEL_VER} 与选择 ${SELECTED} 存在差异"
          echo "   这可能是小版本号不同（正常），请核对 Release 说明"
        fi

    - name: 💾 查看编译服务器剩余磁盘空间
      if: (!cancelled())
      run: df -hT

    - name: 🔧 修复 Git 大文件上传缓冲区
      run: git config --global http.postBuffer 524288000

    - name: 📦 上传完整 bin 目录（仅 UPLOAD_BIN_DIR=true 时生效）
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: >-
          OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE
          }}_kernel${{ github.event.inputs.kernel }}
        path: openwrt/bin

    - name: 📁 整理固件输出文件（提取 boot.img + rootfs.img）
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages

        echo "🔍 查找固件文件..."
        ls -la

        BOOT_IMG=$(ls *boot.img.gz *boot.img 2>/dev/null | head -1)
        SYSTEM_IMG=$(ls *system.img.gz *system.img \
          *rootfs.img.gz *rootfs.img 2>/dev/null | head -1)

        if [ -z "$BOOT_IMG" ] || [ -z "$SYSTEM_IMG" ]; then
          echo "::error::❌ 固件文件未找到！当前目录："
          ls -la
          exit 1
        fi

        echo "✅ 找到 boot 文件: $BOOT_IMG"
        echo "✅ 找到 rootfs 文件: $SYSTEM_IMG"

        mkdir -p firmware_output

        if echo "$BOOT_IMG" | grep -q '\.gz$'; then
          gzip -dk "$BOOT_IMG"
          cp "${BOOT_IMG%.gz}" firmware_output/boot.img
        else
          cp "$BOOT_IMG" firmware_output/boot.img
        fi

        if echo "$SYSTEM_IMG" | grep -q '\.gz$'; then
          gzip -dk "$SYSTEM_IMG"
          cp "${SYSTEM_IMG%.gz}" firmware_output/rootfs.img
        else
          cp "$SYSTEM_IMG" firmware_output/rootfs.img
        fi

        cp *.manifest firmware_output/ 2>/dev/null || true
        cp sha256sums firmware_output/ 2>/dev/null || true

        echo "✅ 固件输出文件清单："
        ls -lh firmware_output/

        echo "FIRMWARE=$PWD/firmware_output" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: 📤 上传固件到 Artifacts（临时下载用）
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: >-
          OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE
          }}_kernel${{ github.event.inputs.kernel }}
        path: ${{ env.FIRMWARE }}

        - name: 🏷️ 生成 Release 标签与说明文件
      id: tag
      if: >-
        env.UPLOAD_RELEASE == 'true' &&
        steps.organize.outputs.status == 'success' &&
        !cancelled()
      run: |
        PROFILE="${{ github.event.inputs.profile }}"
        KERNEL="${{ github.event.inputs.kernel }}"
        # ✅ 修复：在 run 脚本中读取环境变量，而非 YAML 表达式
        # ${{ env.KERNEL_VER }} 在 YAML 层可能因时序问题读到空值
        # 改用 $KERNEL_VER 在 shell 中直接读取，确保拿到编译后的真实值
        KERNEL_VER="${KERNEL_VER}"
        RAW='${{ inputs.extra_packages }}'
        CUSTOM_IP=$(echo "$RAW" | grep -oP '(?<=__ip__)[^,\s]+' || true)
        CUSTOM_HOSTNAME=$(echo "$RAW" | grep -oP '(?<=__hostname__)[^,\s]+' || true)
        DISPLAY_IP=${CUSTOM_IP:-192.168.2.1}
        DISPLAY_HOSTNAME=${CUSTOM_HOSTNAME:-ImmortalWrt}
        EXTRA=$(echo "$RAW" | sed 's/,/ /g' | tr ' ' '\n' \
          | grep -v '^__ip__' | grep -v '^__hostname__' | sed '/^$/d')
        SELECTED_HASH="${{ steps.smart_lock.outputs.selected_hash }}"
        REASON="${{ steps.smart_lock.outputs.selection_reason }}"

        # -------------------------------------------------------
        # ✅ 内核版本一致性最终校验
        # 对比用户选择（主版本）与实际编译版本，给出明确结论
        # -------------------------------------------------------
        if echo "${KERNEL_VER}" | grep -qE "^${KERNEL//./\\.}"; then
          KERNEL_MATCH_STATUS="✅ 与用户选择一致"
        else
          KERNEL_MATCH_STATUS="⚠️ 请核对（实际: ${KERNEL_VER} / 选择: ${KERNEL}）"
        fi

        # -------------------------------------------------------
        # ✅ 根据内核版本生成对应的特性说明
        # 对照上游三个 config 文件的实际差异，如实描述
        # -------------------------------------------------------
        case "${KERNEL}" in
          6.6)
            BBR_STATUS="❌ 不支持（上游 TCP_CONG_ADVANCED=n，使用 cubic）"
            WIFI_STATUS="⚠️ 受限（上游 QCOM_WCNSS_CTRL=n，固件加载可能不稳定）"
            BT_STATUS="❌ 不支持（上游无 BT/BT_QCA 配置）"
            KERNEL_NOTE="LTS 长期支持内核，稳定优先，部分功能受限"
            ;;
          6.12)
            BBR_STATUS="✅ 支持（kmod-tcp-bbr 模块，上游 TCP_CONG_BBR=m）"
            WIFI_STATUS="✅ 完整支持（上游 QCOM_WCNSS_CTRL=y）"
            BT_STATUS="✅ 支持（上游 BT_QCA=y）"
            KERNEL_NOTE="标准内核，功能完整，均衡推荐"
            ;;
          6.18)
            BBR_STATUS="✅ 支持（kmod-tcp-bbr 模块，上游 TCP_CONG_BBR=m）"
            WIFI_STATUS="✅ 完整支持（上游 QCOM_WCNSS_CTRL=y）"
            BT_STATUS="✅ 支持（上游 BT=y）"
            KERNEL_NOTE="最新稳定内核，新特性体验，当前上游默认版本"
            ;;
          *)
            BBR_STATUS="未知"
            WIFI_STATUS="未知"
            BT_STATUS="未知"
            KERNEL_NOTE="未知内核版本"
            ;;
        esac

        # -------------------------------------------------------
        # Release tag：包含真实内核版本号
        # -------------------------------------------------------
        RELEASE_TAG="$(date +"%Y.%m.%d-%H%M")-${PROFILE}-kernel${KERNEL}"
        echo "release_tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT

        touch release.txt
        {
          echo "## ImmortalWrt · 高通410(MSM8916) · ${PROFILE} · Linux ${KERNEL}"
          echo ""
          echo "### 📋 编译信息"
          echo "| 项目 | 信息 |"
          echo "|------|------|"
          echo "| 编译者 | ${{ github.actor }} |"
          echo "| 机型 | ${PROFILE} |"
          echo "| 用户选择内核 | Linux ${KERNEL} |"
          # ✅ 核心修复：显示真实编译内核版本
          echo "| **实际编译内核** | **${KERNEL_VER}** |"
          echo "| 版本一致性 | ${KERNEL_MATCH_STATUS} |"
          echo "| 上游提交 | \`${SELECTED_HASH:0:12}\` |"
          echo "| 提交选择策略 | ${REASON} |"
          echo "| 管理地址 | ${DISPLAY_IP} |"
          echo "| 主机名 | ${DISPLAY_HOSTNAME} |"
          echo "| 默认用户 | root |"
          echo "| 默认密码 | 空（无密码）|"
          echo ""
          echo "### 📦 固件文件说明"
          echo "| 文件名 | 用途 |"
          echo "|--------|------|"
          echo "| boot.img | 引导分区镜像（刷入 boot 分区）|"
          echo "| rootfs.img | 系统根文件系统镜像（刷入 system 分区）|"
          echo ""
          # ✅ 核心修复：根据实际内核版本显示真实特性支持情况
          echo "### 🔧 本次编译内核特性（Linux ${KERNEL} · ${KERNEL_NOTE}）"
          echo "| 特性 | 状态 | 说明 |"
          echo "|------|------|------|"
          echo "| BBR 拥塞控制 | ${BBR_STATUS} | |"
          echo "| WiFi 固件加载 | ${WIFI_STATUS} | WCN3620 |"
          echo "| 蓝牙支持 | ${BT_STATUS} | UFI001C 无蓝牙硬件，仅供参考 |"
          echo "| USB 角色切换 | ✅ /sys/class/usb_role/ | 三版本一致 |"
          echo "| 抢占模式 | ✅ PREEMPT（完全抢占）| 三版本一致 |"
          echo "| 文件系统 | ✅ ext4（1024MB）| 三版本一致 |"
          echo ""
          echo "### 📊 三内核版本横向对比"
          echo "| 内核 | 类型 | BBR | WiFi固件 | 推荐场景 |"
          echo "|------|------|-----|---------|--------|"
          if [ "${KERNEL}" = "6.6" ]; then
            echo "| **6.6** ← 本次 | LTS | ❌ | ⚠️ 受限 | 极致稳定 |"
          else
            echo "| 6.6 | LTS | ❌ | ⚠️ 受限 | 极致稳定 |"
          fi
          if [ "${KERNEL}" = "6.12" ]; then
            echo "| **6.12** ← 本次 | 标准 | ✅ | ✅ | 均衡推荐 |"
          else
            echo "| 6.12 | 标准 | ✅ | ✅ | 均衡推荐 |"
          fi
          if [ "${KERNEL}" = "6.18" ]; then
            echo "| **6.18** ← 本次 | 最新 | ✅ | ✅ | 新特性体验 |"
          else
            echo "| 6.18 | 最新 | ✅ | ✅ | 新特性体验 |"
          fi
          echo ""
          if [ -n "$EXTRA" ]; then
            echo "### ➕ 本次额外添加的包"
            echo "$EXTRA" | sed 's/^/- /'
          else
            echo "### ➕ 本次额外添加的包"
            echo "无"
          fi
        } >> release.txt

        echo "status=success" >> $GITHUB_OUTPUT
        echo "✅ Release 说明文件生成完成"
        echo ""
        echo "📋 Release 内容预览："
        echo "   Tag:      ${RELEASE_TAG}"
        echo "   选择内核: Linux ${KERNEL}"
        echo "   实际内核: ${KERNEL_VER}"
        echo "   一致性:   ${KERNEL_MATCH_STATUS}"

        - name: 🚀 上传固件到 Releases（正式发布）
      if: >-
        env.UPLOAD_RELEASE == 'true' &&
        steps.organize.outputs.status == 'success' &&
        steps.tag.outputs.status == 'success' &&
        !cancelled()
      uses: ncipollo/release-action@main
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag: ${{ steps.tag.outputs.release_tag }}
        # ✅ 修复：Release 标题同时显示选择版本和真实版本
        # 格式：ImmortalWrt ufi001c kernel6.12(6.12.28) _202507040830
        name: >-
          ImmortalWrt ${{ github.event.inputs.profile }}
          kernel${{ github.event.inputs.kernel }}(${{ env.KERNEL_VER }})
          ${{ env.FILE_DATE }}
        bodyFile: release.txt
        artifacts: ${{ env.FIRMWARE }}/**/*
        artifactErrorsFailBuild: false
        allowUpdates: true
        draft: false
        prerelease: false

    - name: 🗑️ 清理超过保留期的旧 Workflow 运行记录
      if: always()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        RETAIN_DAYS: 7
        KEEP_MINIMUM_RUNS: 5
      run: |
        echo "🔍 查询 Workflow 运行记录..."
        RUNS=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
          "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=100")

        # ✅ 修复：正确的时间戳比较（创建时间 < 截止时间）
        CUTOFF=$(date -d "-${RETAIN_DAYS} days" +%s)
        DEL_IDS=$(echo "$RUNS" | jq -r \
          --argjson cutoff "$CUTOFF" \
          --argjson keep "$KEEP_MINIMUM_RUNS" '
          [.workflow_runs[]
            | select((.created_at | fromdateiso8601) < $cutoff)
            | {id, created_at}
          ]
          | sort_by(.created_at)
          | .[:-$keep]
          | .[].id
        ')

        if [[ -z "$DEL_IDS" ]]; then
          echo "✅ 没有需要清理的旧运行记录"
        else
          echo "$DEL_IDS" | while read run_id; do
            echo "🗑️ 正在删除运行记录 ID: $run_id"
            curl -X DELETE -H "Authorization: token $GITHUB_TOKEN" \
              "https://api.github.com/repos/${{ github.repository }}/actions/runs/$run_id"
          done
          echo "✅ 旧运行记录清理完成"
        fi
